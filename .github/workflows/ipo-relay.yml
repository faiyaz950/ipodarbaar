# Relays IPO API pages to the site for hosts whose firewall can't reach the IPO API.
# Needs repository secrets IPO_API_KEY and IPO_PUSH_TOKEN (same value as the server's .env),
# and IPO_API_PULL=false on the server so it stops trying to pull directly.
name: IPO relay

on:
  schedule:
    - cron: '*/15 * * * *'   # latest 150 IPOs
    - cron: '0 22 * * *'     # full catalogue at 03:30 IST
  workflow_dispatch:
    inputs:
      full:
        description: Relay every page
        type: boolean
        default: false

concurrency:
  group: ipo-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IPO_API_URL: https://www.finowings.com/ipo-sync.php
      SITE_URL: https://ipodarbaar.in
      PUSH_URL: https://ipodarbaar.in/internal/ipo-push
      IPO_API_KEY: ${{ secrets.IPO_API_KEY }}
      PUSH_TOKEN: ${{ secrets.IPO_PUSH_TOKEN }}
      FULL: ${{ github.event.schedule == '0 22 * * *' || inputs.full == true }}
    steps:
      - name: Relay IPO pages
        run: |
          set -euo pipefail
          max_pages=3
          if [ "$FULL" = "true" ]; then max_pages=100; fi
          offset=0
          page=0
          while [ "$page" -lt "$max_pages" ]; do
            curl -fsS --retry 2 -m 30 -G "$IPO_API_URL" \
              --data-urlencode "limit=50" --data-urlencode "offset=$offset" --data-urlencode "key=$IPO_API_KEY" \
              -o page.json
            jq -e '.status == "success"' page.json > /dev/null
            count=$(jq '.data | length' page.json)
            jq -c '{data: .data}' page.json | curl -fsS --retry 2 -m 60 -X POST "$PUSH_URL" \
              -H "Authorization: Bearer $PUSH_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
              --data-binary @- -o /dev/null
            page=$((page + 1))
            offset=$((offset + 50))
            echo "page $page: $count rows"
            if [ "$(jq '.pagination.has_more // false' page.json)" != "true" ] || [ "$count" -eq 0 ]; then break; fi
          done

      - name: Relay missing logo banners
        run: |
          set -euo pipefail
          curl -fsS --retry 2 -m 60 "$SITE_URL/internal/logos/missing" \
            -H "Authorization: Bearer $PUSH_TOKEN" -H "Accept: application/json" -o missing.json
          echo "$(jq length missing.json) logos missing"
          jq -c '.[]' missing.json | while read -r item; do
            id=$(jq -r '.api_id' <<< "$item")
            url=$(jq -r '.url' <<< "$item")
            if ! curl -fsS --retry 1 -m 20 "$url" -o banner.img; then
              echo "download failed: $id"
              continue
            fi
            curl -sS -m 60 -X POST "$SITE_URL/internal/logos/$id" \
              -H "Authorization: Bearer $PUSH_TOKEN" -H "Accept: application/json" \
              -F "banner=@banner.img" -w " $id\n" || echo "push failed: $id"
          done

      - name: Relay IPO pages (registrar, lot size, company details, financials)
        run: |
          set -euo pipefail
          limit=30
          if [ "$FULL" = "true" ]; then limit=1500; fi
          curl -fsS --retry 2 -m 60 "$SITE_URL/internal/pages/stale?limit=$limit" \
            -H "Authorization: Bearer $PUSH_TOKEN" -H "Accept: application/json" -o pages.json
          echo "$(jq length pages.json) pages to read"
          relay_one() {
            local id=$1 url=$2 page="page-$1.html.gz"
            if ! curl -fsS --retry 1 -m 30 "$url" | gzip -c > "$page"; then
              echo "download failed: $id"; rm -f "$page"; return 0
            fi
            curl -sS -m 60 -X POST "$SITE_URL/internal/pages/$id" \
              -H "Authorization: Bearer $PUSH_TOKEN" -H "Accept: application/json" \
              -F "page=@$page" -w " $id\n" || echo "push failed: $id"
            rm -f "$page"
          }
          export -f relay_one
          jq -r '.[] | "\(.api_id) \(.url)"' pages.json | xargs -P 3 -L 1 bash -c 'relay_one "$0" "$1"'
